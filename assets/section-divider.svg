      <stop offset=".55" stop-color="#a371f7"/>
      <stop offset=".78" stop-color="#79c0ff"/>
      <stop offset="1" stop-color="#39e7c0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#a9faff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#79e9f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .traveler { animation: travel 5s linear infinite; }
    .endpoints { animation: breathe 3s ease-in-out infinite; }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
