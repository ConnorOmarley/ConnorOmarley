  <path d="M24 12H320L326 10H345L351 12H876" fill="none" stroke="url(#line)" stroke-width="1.5"/>
  <path class="endpoints" d="m18 12 6-4 6 4-6 4Zm852 0 6-4 6 4-6 4Z" fill="#39e7c0"/>
